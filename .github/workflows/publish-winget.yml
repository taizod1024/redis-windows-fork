name: Publish winget (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: windows-latest
    env:
      WINGETCREATE_VERSION: 1.12.13.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release asset URL
        id: release
        run: |
          function Get-ReleaseByTag([string]$candidateTag) {
            $releaseApiUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$candidateTag"
            return Invoke-RestMethod -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              "User-Agent" = "redis-windows-fork-winget-publish"
            } -Uri $releaseApiUrl
          }

          # Get latest release
          $releasesUrl = "https://api.github.com/repos/${{ github.repository }}/releases"
          $releases = Invoke-RestMethod -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "redis-windows-fork-winget-publish"
          } -Uri $releasesUrl

          if (-not $releases -or $releases.Count -eq 0) {
            throw "No releases found."
          }

          $latest = $releases | Select-Object -First 1
          $latestVersion = $latest.tag_name

          $tagsToTry = @($latestVersion)
          if ($latestVersion.StartsWith('v')) {
            $tagsToTry += $latestVersion.TrimStart('v')
          }
          else {
            $tagsToTry += "v$latestVersion"
          }

          $event = $null
          foreach ($candidateTag in $tagsToTry) {
            try {
              $event = Get-ReleaseByTag $candidateTag
              break
            }
            catch {
              $statusCode = $null
              try {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }
              catch {
              }

              if ($statusCode -and $statusCode -ne 404) {
                throw "Release tag lookup failed for '$candidateTag' with status ${statusCode}: $($_.Exception.Message)"
              }

              Write-Output "Release tag lookup failed for '$candidateTag'. Trying next candidate..."
            }
          }

          if (-not $event) {
            throw "Unable to find release for version '$latestVersion'."
          }

          $tag = $event.tag_name
          $assetUrl = $null
          if ($event.assets) {
            $asset = $event.assets | Where-Object { $_.name -like "*.exe" -or $_.name -like "*.zip" } | Select-Object -First 1
            if ($asset) {
              $assetUrl = $asset.browser_download_url
            }
          }

          if (-not $assetUrl) {
            throw "Unable to find a downloadable asset in release '$tag'."
          }

          Write-Output "version=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "asset_url=$assetUrl" >> $env:GITHUB_OUTPUT
          Write-Output "Found release asset: $assetUrl"

      - name: Install wingetcreate
        run: |
          $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/v$env:WINGETCREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest -Uri $wingetCreateUrl -OutFile wingetcreate.exe
          .\wingetcreate.exe info

      - name: Update winget package
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN || secrets.GH_PAT }}
        shell: pwsh
        run: |
          function Normalize-Token([string]$value) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              return ""
            }
            return ($value -replace "`r|`n", "").Trim()
          }

          $version = "${{ steps.release.outputs.version }}"
          $url = "${{ steps.release.outputs.asset_url }}"
          $token = Normalize-Token $env:WINGET_TOKEN

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "No GitHub token is available for winget submission."
          }

          if ($token -notmatch '^[A-Za-z0-9_]+$') {
            throw "GitHub token contains invalid characters."
          }

          Write-Output "Submitting to winget: taizod1024.redis-windows-fork $version"
          Write-Output "Installer URL: $url"

          $updateArgs = @(
            "update"
            "--token", $token
            "--urls", $url
            "--version", $version
            "taizod1024.redis-windows-fork"
            "--submit"
          )

          & .\wingetcreate.exe @updateArgs

          if ($LASTEXITCODE -eq 0) {
            Write-Output "Updated existing package successfully."
            exit 0
          }

          Write-Output "Package update failed. Trying first-time package registration flow..."

          $packageName = "redis-windows-fork"
          $publisher = "taizod1024"
          $id = "taizod1024.redis-windows-fork"
          $shortDescription = "Redis for Windows (MSYS2-only fork)"
          $license = "BSD-3-Clause"
          $licenseUrl = "https://github.com/redis-windows/redis-windows/blob/main/LICENSE"

          $manifestDir = Join-Path $pwd "winget-manifests"
          if (Test-Path $manifestDir) {
            Remove-Item -Path $manifestDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $manifestDir | Out-Null

          $versionDir = Join-Path $manifestDir "manifests" "t" "$publisher" "$packageName" "$version"
          New-Item -ItemType Directory -Path $versionDir -Force | Out-Null

          $installerArchive = Join-Path $env:RUNNER_TEMP "$id-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile $installerArchive
          $installerSha256 = (Get-FileHash -LiteralPath $installerArchive -Algorithm SHA256).Hash.ToUpperInvariant()
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($installerArchive)
          try {
            $serverPattern = "(?i)(^|/)redis-server\.exe$"
            $serverEntries = @($zip.Entries | Where-Object { $_.FullName -match $serverPattern })
            if ($serverEntries.Count -ne 1) {
              throw "Expected exactly one redis-server.exe entry in the package archive; found $($serverEntries.Count)."
            }
            $nestedInstallerPath = $serverEntries[0].FullName.Replace('/', '\')
          }
          finally {
            $zip.Dispose()
          }

          $installerPath = Join-Path $versionDir "$id.installer.yaml"
          @(
            "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json"
            "PackageIdentifier: $id"
            "PackageVersion: $version"
            "Installers:"
            "- Architecture: x64"
            "  InstallerUrl: $url"
            "  InstallerSha256: $installerSha256"
            "  InstallerType: zip"
            "  NestedInstallerType: portable"
            "  NestedInstallerFiles:"
            "    - RelativeFilePath: $nestedInstallerPath"
            "      PortableCommandAlias: redis-server"
            "ManifestType: installer"
            "ManifestVersion: 1.12.0"
          ) -join "`n" | Out-File -FilePath $installerPath -Encoding utf8

          $defaultPath = Join-Path $versionDir "$id.yaml"
          @(
            "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json"
            "PackageIdentifier: $id"
            "PackageVersion: $version"
            "DefaultLocale: en-US"
            "ManifestType: version"
            "ManifestVersion: 1.12.0"
          ) -join "`n" | Out-File -FilePath $defaultPath -Encoding utf8

          $localePath = Join-Path $versionDir "$id.locale.en-US.yaml"
          @(
            "# yaml-language-server: `$schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json"
            "PackageIdentifier: $id"
            "PackageVersion: $version"
            "PackageLocale: en-US"
            "Publisher: $publisher"
            "PublisherUrl: https://github.com/$publisher"
            "PublisherSupportUrl: https://github.com/${{ github.repository }}/issues"
            "PackageName: redis-windows"
            "PackageUrl: https://github.com/${{ github.repository }}"
            "License: $license"
            "LicenseUrl: $licenseUrl"
            "ShortDescription: $shortDescription"
            "ManifestType: defaultLocale"
            "ManifestVersion: 1.12.0"
          ) -join "`n" | Out-File -FilePath $localePath -Encoding utf8

          Write-Output "Created manifest files in $manifestDir"
          Get-ChildItem -Recurse $manifestDir | Write-Output

          # submit expects the directory containing the YAML files, not a parent with subdirectories.
          $manifestPath = $versionDir
          Write-Output "Submitting manifests from: $manifestPath"

          if (-not (Test-Path $manifestPath)) {
            throw "Manifest directory does not exist: $manifestPath"
          }
          if ((Get-ChildItem -Path $manifestPath -File -Filter "*.yaml").Count -ne 3) {
            throw "Expected exactly three manifest YAML files in: $manifestPath"
          }

          .\wingetcreate.exe submit "$manifestPath" --token $token
          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate failed to submit the recreated package manifest."
          }
