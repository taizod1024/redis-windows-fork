name: Publish to winget (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: windows-latest
    env:
      WINGETCREATE_VERSION: 1.12.8.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release asset URL
        id: release
        run: |
          function Get-ReleaseByTag([string]$candidateTag) {
            $releaseApiUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$candidateTag"
            return Invoke-RestMethod -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              "User-Agent" = "redis-windows-fork-winget-publish"
            } -Uri $releaseApiUrl
          }

          # Get latest release
          $releasesUrl = "https://api.github.com/repos/${{ github.repository }}/releases"
          $releases = Invoke-RestMethod -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "redis-windows-fork-winget-publish"
          } -Uri $releasesUrl

          if (-not $releases -or $releases.Count -eq 0) {
            throw "No releases found."
          }

          $latest = $releases | Select-Object -First 1
          $latestVersion = $latest.tag_name

          $tagsToTry = @($latestVersion)
          if ($latestVersion.StartsWith('v')) {
            $tagsToTry += $latestVersion.TrimStart('v')
          }
          else {
            $tagsToTry += "v$latestVersion"
          }

          $event = $null
          foreach ($candidateTag in $tagsToTry) {
            try {
              $event = Get-ReleaseByTag $candidateTag
              break
            }
            catch {
              $statusCode = $null
              try {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }
              catch {
              }

              if ($statusCode -and $statusCode -ne 404) {
                throw "Release tag lookup failed for '$candidateTag' with status ${statusCode}: $($_.Exception.Message)"
              }

              Write-Output "Release tag lookup failed for '$candidateTag'. Trying next candidate..."
            }
          }

          if (-not $event) {
            throw "Unable to find release for version '$latestVersion'."
          }

          $tag = $event.tag_name
          $assetUrl = $null
          if ($event.assets) {
            $asset = $event.assets | Where-Object { $_.name -like "*.exe" -or $_.name -like "*.zip" } | Select-Object -First 1
            if ($asset) {
              $assetUrl = $asset.browser_download_url
            }
          }

          if (-not $assetUrl) {
            throw "Unable to find a downloadable asset in release '$tag'."
          }

          Write-Output "version=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "asset_url=$assetUrl" >> $env:GITHUB_OUTPUT
          Write-Output "Found release asset: $assetUrl"

      - name: Install wingetcreate
        run: |
          # Try to use system winget first
          $wingetPath = $(Get-Command winget -ErrorAction SilentlyContinue).Source
          if ($wingetPath) {
            Write-Output "Using system winget: $wingetPath"
            exit 0
          }

          # Try downloading wingetcreate from latest release
          Write-Output "Attempting to download wingetcreate..."
          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/winget-create/releases" `
              -Headers @{"User-Agent" = "PowerShell"}
            $latest = $releases | Where-Object { -not $_.prerelease } | Select-Object -First 1
            $asset = $latest.assets | Where-Object { $_.name -eq "wingetcreate.exe" } | Select-Object -First 1
            
            if ($asset) {
              $downloadUrl = $asset.browser_download_url
              Write-Output "Found wingetcreate: $downloadUrl"
              Invoke-WebRequest -Uri $downloadUrl -OutFile "wingetcreate.exe" -TimeoutSec 30
              Write-Output "$(Get-Location)" | Add-Content $env:GITHUB_PATH
            } else {
              throw "No wingetcreate.exe asset found in latest release"
            }
          } catch {
            Write-Output "Failed to download wingetcreate: $_"
            exit 1
          }

      - name: Update winget package
        run: |
          $assetUrl = "${{ steps.release.outputs.asset_url }}"
          $version = "${{ steps.release.outputs.version }}"

          # Use wingetcreate if it exists, otherwise try winget
          $wingetcreate = "wingetcreate.exe"
          if (-not (Get-Command $wingetcreate -ErrorAction SilentlyContinue)) {
            $wingetcreate = "winget"
          }

          Write-Output "Using: $wingetcreate"
          Write-Output "Publishing taizod1024.redis-windows-fork version $version"
          Write-Output "Asset URL: $assetUrl"

          & $wingetcreate update --token $env:GH_TOKEN `
            --urls $assetUrl `
            --version $version `
            taizod1024.redis-windows-fork

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish to winget (exit code: $LASTEXITCODE)"
          }
