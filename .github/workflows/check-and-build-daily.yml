name: Daily Check and Build

on:
  schedule:
    # Run every day at 21:00 UTC (06:00 JST)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: windows-latest
    outputs:
      new_version: ${{ steps.compare.outputs.new_version }}
      latest_redis_tag: ${{ steps.get-latest.outputs.tag }}

    steps:
      - name: Get latest Redis tag
        id: get-latest
        run: |
          $latestRedisReleaseUrl = "https://api.github.com/repos/redis/redis/releases/latest"
          $latestInfo = Invoke-RestMethod -Headers @{
            Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            "User-Agent" = "redis-windows-msys2-daily-check"
          } -Uri $latestRedisReleaseUrl

          if ([string]::IsNullOrWhiteSpace($latestInfo.tag_name)) {
            throw "Unable to resolve latest Redis tag from redis/redis releases API."
          }

          $latestTag = $latestInfo.tag_name
          Write-Output "tag=$latestTag" >> $env:GITHUB_OUTPUT
          Write-Output "Latest Redis tag: $latestTag"

      - name: Get last built version
        id: get-last
        run: |
          function Get-LastBuiltVersion() {
            $releasesUrl = "https://api.github.com/repos/${{ github.repository }}/releases"
            $releases = Invoke-RestMethod -Headers @{
              Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"
              "User-Agent" = "redis-windows-msys2-daily-check"
            } -Uri $releasesUrl

            if ($releases -and $releases.Count -gt 0) {
              # Get the most recent release
              $latest = $releases | Select-Object -First 1
              return $latest.tag_name
            }

            return $null
          }

          $lastVersion = Get-LastBuiltVersion
          Write-Output "last=$lastVersion" >> $env:GITHUB_OUTPUT
          Write-Output "Last built version: $lastVersion"

      - name: Compare versions
        id: compare
        run: |
          $latestTag = "${{ steps.get-latest.outputs.tag }}"
          $lastVersion = "${{ steps.get-last.outputs.last }}"

          $isNewVersion = $false
          if ([string]::IsNullOrWhiteSpace($lastVersion)) {
            Write-Output "No previous release found. Will build."
            $isNewVersion = $true
          }
          elseif ($latestTag -ne $lastVersion) {
            Write-Output "New version detected: $latestTag (last: $lastVersion)"
            $isNewVersion = $true
          }
          else {
            Write-Output "Already built version: $latestTag"
          }

          Write-Output "new_version=$($isNewVersion.ToString().ToLower())" >> $env:GITHUB_OUTPUT

  build:
    needs: check
    if: needs.check.outputs.new_version == 'true'
    uses: ./.github/workflows/build-winget-core.yml
    with:
      use_latest_tag: true
      make_latest: true
      prerelease: false
    secrets: inherit

  publish:
    needs: [check, build]
    if: success()
    runs-on: windows-latest
    env:
      WINGETCREATE_VERSION: 1.12.8.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release asset URL
        id: release
        run: |
          function Get-ReleaseByTag([string]$candidateTag) {
            $releaseApiUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$candidateTag"
            return Invoke-RestMethod -Headers @{
              Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"
              "User-Agent" = "redis-windows-msys2-daily-publish"
            } -Uri $releaseApiUrl
          }

          $inputTag = "${{ needs.check.outputs.latest_redis_tag }}"
          $tagsToTry = @($inputTag)
          if ($inputTag.StartsWith('v')) {
            $tagsToTry += $inputTag.TrimStart('v')
          }
          else {
            $tagsToTry += "v$inputTag"
          }

          $event = $null
          foreach ($candidateTag in $tagsToTry) {
            try {
              $event = Get-ReleaseByTag $candidateTag
              break
            }
            catch {
              $statusCode = $null
              try {
                $statusCode = [int]$_.Exception.Response.StatusCode
              }
              catch {
              }

              if ($statusCode -and $statusCode -ne 404) {
                throw "Release tag lookup failed for '$candidateTag' with status ${statusCode}: $($_.Exception.Message)"
              }

              Write-Output "Release tag lookup failed for '$candidateTag'. Trying next candidate..."
            }
          }

          if (-not $event) {
            throw "Unable to find release for input tag '$inputTag'."
          }

          $tag = $event.tag_name
          $assetUrl = $null
          if ($event.assets) {
            $asset = $event.assets | Where-Object { $_.name -like "*.exe" -or $_.name -like "*.zip" } | Select-Object -First 1
            if ($asset) {
              $assetUrl = $asset.browser_download_url
            }
          }

          if (-not $assetUrl) {
            throw "Unable to find a downloadable asset in release '$tag'."
          }

          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "assetUrl=$assetUrl" >> $env:GITHUB_OUTPUT
          Write-Output "Found release asset: $assetUrl"

      - name: Install wingetcreate
        run: |
          $version = $env:WINGETCREATE_VERSION
          $downloadUrl = "https://github.com/microsoft/winget-create/releases/download/v${version}/wingetcreate.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "wingetcreate.exe"
          Write-Output "$(Get-Location)" | Add-Content $env:GITHUB_PATH

      - name: Update winget package
        run: |
          $assetUrl = "${{ steps.release.outputs.assetUrl }}"
          $tag = "${{ steps.release.outputs.tag }}"

          & wingetcreate.exe update --token ${{ secrets.GITHUB_TOKEN }} `
            --urls $assetUrl `
            --version ${tag#v} `
            taizod1024.redis-windows-fork
